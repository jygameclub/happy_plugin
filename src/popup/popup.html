<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Debug</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Happy 调试控制台</h1>
    <p class="description">多终端调试工具</p>
    <button class="btn-primary" id="btn-open-panel">打开调试面板</button>
    <div class="quick-status">
      <div class="status-item">
        <span class="label">会话数:</span>
        <span id="session-count">-</span>
      </div>
      <div class="status-item">
        <span class="label">当前活动:</span>
        <span id="active-session">无</span>
      </div>
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>

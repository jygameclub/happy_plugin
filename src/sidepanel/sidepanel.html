<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 调试控制台</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="header-title">Happy 调试控制台</h1>
      <span class="header-version">v1.0.0</span>
    </header>

    <!-- Section 0: API 测试聊天 -->
    <section class="panel" data-panel="chat-test">
      <div class="panel-header" data-toggle="chat-test">
        <span class="panel-icon">&#9662;</span>
        <span class="panel-title">API 测试聊天</span>
      </div>
      <div class="panel-content" id="chat-test-content">
        <div class="chat-api-selector">
          <label class="label">API:</label>
          <span class="api-label">DeepSeek</span>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-empty">发送消息测试 API 是否正常工作</div>
        </div>
        <div class="chat-input-area">
          <input type="text" class="input-text" id="chat-input" placeholder="输入测试消息...">
          <button class="btn btn-small btn-primary" id="chat-send-btn">发送</button>
          <button class="btn btn-small btn-secondary" id="chat-clear-btn">清空</button>
        </div>
      </div>
    </section>

    <!-- Section 1: 环境 / API 配置 -->
    <section class="panel collapsed" data-panel="environment">
      <div class="panel-header" data-toggle="environment">
        <span class="panel-icon">&#9662;</span>
        <span class="panel-title">环境 / API 配置</span>
      </div>
      <div class="panel-content" id="environment-content">
        <!-- DeepSeek API 配置 -->
        <div class="api-config-section">
          <div class="api-config-header">
            <span class="api-name">DeepSeek API</span>
            <span class="api-indicator" id="deepseek-status">--</span>
          </div>
          <div class="api-config-form" id="deepseek-config-form">
            <div class="form-group">
              <label class="label" for="deepseek-base-url">Base URL:</label>
              <input type="text" class="input-text" id="deepseek-base-url" placeholder="https://api.deepseek.com">
            </div>
            <div class="form-group">
              <label class="label" for="deepseek-api-key">API Key:</label>
              <input type="password" class="input-text" id="deepseek-api-key" placeholder="输入 API Key">
            </div>
            <div class="btn-group">
              <button class="btn btn-small btn-secondary" id="save-deepseek-btn">保存</button>
              <button class="btn btn-small btn-primary" id="check-deepseek-btn">检查连接</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 2: 会话 / 终端 -->
    <section class="panel collapsed" data-panel="session">
      <div class="panel-header" data-toggle="session">
        <span class="panel-icon">&#9662;</span>
        <span class="panel-title">会话 / 终端</span>
      </div>
      <div class="panel-content" id="session-content">
        <button class="btn btn-primary btn-full" id="scan-sessions-btn">扫描会话</button>
        <div class="session-list" id="session-list">
          <div class="session-empty">未找到会话。点击"扫描会话"来检测终端。</div>
        </div>
        <div class="active-session-display">
          <label class="label">当前会话:</label>
          <div class="active-session-info" id="active-session-info">未选择</div>
        </div>
      </div>
    </section>

    <!-- Section 3: 输入模拟 -->
    <section class="panel collapsed" data-panel="input">
      <div class="panel-header" data-toggle="input">
        <span class="panel-icon">&#9662;</span>
        <span class="panel-title">输入模拟</span>
      </div>
      <div class="panel-content" id="input-content">
        <textarea
          class="input-textarea"
          id="input-text"
          placeholder="输入要模拟的命令..."
          rows="4"
        ></textarea>
        <div class="btn-group">
          <button class="btn btn-primary" id="preview-input-btn">预览</button>
          <button class="btn btn-secondary" id="clear-input-btn">清空</button>
        </div>
      </div>
    </section>

    <!-- Section 4: API / AI 判断 -->
    <section class="panel collapsed" data-panel="ai-judge">
      <div class="panel-header" data-toggle="ai-judge">
        <span class="panel-icon">&#9662;</span>
        <span class="panel-title">API / AI 判断</span>
      </div>
      <div class="panel-content" id="ai-judge-content">
        <div class="form-group">
          <label class="label" for="line-count">分析行数:</label>
          <input
            type="number"
            class="input-number"
            id="line-count"
            value="20"
            min="1"
            max="100"
          >
        </div>
        <button class="btn btn-primary btn-full" id="analyze-btn">分析会话</button>
        <div class="ai-result" id="ai-result">
          <div class="ai-result-empty">暂无分析结果。点击"分析会话"获取 AI 判断。</div>
        </div>
      </div>
    </section>

    <!-- Section 5: 动作模拟 -->
    <section class="panel collapsed" data-panel="action">
      <div class="panel-header" data-toggle="action">
        <span class="panel-icon">&#9662;</span>
        <span class="panel-title">动作模拟</span>
      </div>
      <div class="panel-content" id="action-content">
        <div class="action-preview" id="action-preview">
          <div class="action-preview-empty">暂无待执行动作</div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="execute-action-btn" disabled>执行</button>
          <button class="btn btn-warning" id="cancel-action-btn" disabled>取消</button>
        </div>
      </div>
    </section>

    <!-- Section 6: 日志与检查器 -->
    <section class="panel collapsed" data-panel="logs">
      <div class="panel-header" data-toggle="logs">
        <span class="panel-icon">&#9662;</span>
        <span class="panel-title">日志与检查器</span>
      </div>
      <div class="panel-content" id="logs-content">
        <div class="log-viewer" id="log-viewer">
          <div class="log-empty">暂无日志。</div>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" id="export-logs-btn">导出</button>
          <button class="btn btn-warning" id="clear-logs-btn">清空</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="sidepanel.ts"></script>
</body>
</html>
